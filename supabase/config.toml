project_id = "gvwzpfoqeheciteetewv"

[auth]
site_url = "https://rootsandwings-edu.com"
additional_redirect_urls = ["https://rootsandwings-edu.com/**", "https://www.rootsandwings-edu.com/**", "https://roots-and-wings-nine.vercel.app/**", "http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_expiry = 900


# Resend as the auth SMTP sender. The key is a sending-only key minted for this purpose; it is read from
# supabase/.env at push time (gitignored) and never stored in this file.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_KEY)"
admin_email = "hello@rootsandwings-edu.com"
sender_name = "שורשים וכנפיים"

# Links go straight to our callback with a token hash, so they work from any browser or mail app (no PKCE cookie needed).
[auth.email.template.magic_link]
subject = "הקישור לכניסה — שורשים וכנפיים"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "ברוכים הבאים לשורשים וכנפיים — קישור כניסה"
content_path = "./supabase/templates/confirmation.html"
